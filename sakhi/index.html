<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>సఖి</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #1c2459;
      --text-color: #fff8e7;
      --marigold: #f6b800;
      --rose: #e0457b;
      --white: #ffffff;
      --card-bg: rgba(255, 248, 231, 0.08);
      --border-color: rgba(246, 184, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Noto Sans Telugu', sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem 1rem;
      text-align: center;
      overflow-x: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      flex: 1;
      gap: 1.25rem;
    }

    /* Top Section */
    .header-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .app-title {
      font-size: 2.75rem;
      font-weight: 800;
      color: var(--marigold);
      letter-spacing: 1px;
      line-height: 1.2;
      text-shadow: 0 2px 12px rgba(246, 184, 0, 0.25);
    }

    /* Caption Section */
    .caption-box {
      width: 100%;
      min-height: 5.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.5rem 1rem;
    }

    .caption-text {
      font-size: clamp(1.2rem, 4vw, 1.55rem);
      font-weight: 700;
      line-height: 1.6;
      color: var(--text-color);
      transition: color 0.3s ease;
      white-space: normal;
      word-wrap: break-word;
      overflow-wrap: break-word;
      text-align: center;
      max-width: 340px;
      margin: 0 auto;
    }

    /* Documents Row */
    .docs-container {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
      padding: 0 0.25rem;
      transition: opacity 0.3s ease;
    }

    .docs-container.hidden {
      display: none;
    }

    .doc-card {
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 0.6rem 0.4rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.25rem;
      min-width: 75px;
      flex: 1 1 calc(31% - 0.5rem);
      max-width: 105px;
    }

    .doc-emoji {
      font-size: 1.85rem;
      line-height: 1;
    }

    .doc-label {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-color);
      line-height: 1.25;
      text-align: center;
      white-space: normal;
      word-break: break-word;
    }

    /* Place Box */
    .place-box {
      width: 100%;
      background: rgba(246, 184, 0, 0.1);
      border-left: 5px solid var(--marigold);
      border-radius: 8px;
      padding: 1rem 1.25rem;
      text-align: left;
      font-size: 1.15rem;
      font-weight: 600;
      line-height: 1.6;
      color: var(--text-color);
    }

    .place-box.hidden {
      display: none;
    }

    /* Voice Control Area */
    .voice-control-area {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 1.5rem 0 1rem;
      width: 100%;
    }

    .mic-wrapper {
      position: relative;
      width: 250px;
      height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Kolam Concentric Rings */
    .ring {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      box-sizing: border-box;
      transition: all 0.4s ease;
    }

    .ring-1 {
      width: 175px;
      height: 175px;
      border: 2px dashed rgba(246, 184, 0, 0.45);
    }

    .ring-2 {
      width: 210px;
      height: 210px;
      border: 2px dotted rgba(246, 184, 0, 0.35);
    }

    .ring-3 {
      width: 245px;
      height: 245px;
      border: 2px solid rgba(246, 184, 0, 0.2);
    }

    /* Mic Button */
    .mic-button {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background-color: var(--marigold);
      color: #1c2459;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 5;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
      transition: transform 0.2s ease, background-color 0.3s ease, box-shadow 0.3s ease;
    }

    .mic-button:focus-visible {
      outline: 4px solid var(--white);
      outline-offset: 6px;
    }

    .mic-button:active {
      transform: scale(0.95);
    }

    .mic-icon {
      width: 64px;
      height: 64px;
      fill: #1c2459;
      transition: fill 0.3s ease;
    }

    /* Spinner for thinking state */
    .spinner-ring {
      display: none;
      position: absolute;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 6px solid rgba(28, 36, 89, 0.2);
      border-top-color: #1c2459;
      animation: spin 1s linear infinite;
    }

    /* Pill Replay Button */
    .replay-button {
      background: transparent;
      border: 2px solid var(--border-color);
      color: var(--text-color);
      font-family: inherit;
      font-size: 1.15rem;
      font-weight: 700;
      padding: 0.65rem 1.6rem;
      border-radius: 9999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.75rem;
      transition: all 0.2s ease;
    }

    .replay-button:hover {
      background: rgba(246, 184, 0, 0.15);
      border-color: var(--marigold);
    }

    .replay-button:focus-visible {
      outline: 3px solid var(--marigold);
      outline-offset: 4px;
    }

    .replay-button:active {
      transform: scale(0.97);
    }

    .replay-button.hidden {
      visibility: hidden;
      opacity: 0;
    }

    /* ====================================================
       STATE STYLES VIA BODY CLASS
       ==================================================== */

    /* 1. LISTENING STATE */
    body.listening .mic-button {
      background-color: var(--rose);
      box-shadow: 0 0 30px rgba(224, 69, 123, 0.6);
    }

    body.listening .mic-icon {
      fill: var(--white);
    }

    body.listening .ring-1 {
      border: 3px solid var(--rose);
      animation: pulse-rose-1 1.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite;
    }

    body.listening .ring-2 {
      border: 2px solid var(--rose);
      animation: pulse-rose-2 1.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite 0.25s;
    }

    body.listening .ring-3 {
      border: 2px solid var(--rose);
      animation: pulse-rose-3 1.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite 0.5s;
    }

    /* 2. THINKING STATE */
    body.thinking .mic-button {
      background-color: var(--marigold);
    }

    body.thinking .spinner-ring {
      display: block;
    }

    body.thinking .mic-icon {
      opacity: 0.35;
    }

    body.thinking .ring {
      opacity: 0.2;
    }

    /* 3. SPEAKING STATE */
    body.speaking .mic-button {
      background-color: var(--marigold);
    }

    body.speaking .ring-1 {
      border: 3px solid var(--white);
      animation: pulse-white-1 1.8s ease-out infinite;
    }

    body.speaking .ring-2 {
      border: 2px solid var(--white);
      animation: pulse-white-2 1.8s ease-out infinite 0.3s;
    }

    body.speaking .ring-3 {
      border: 2px solid var(--white);
      animation: pulse-white-3 1.8s ease-out infinite 0.6s;
    }

    /* ====================================================
       ANIMATIONS
       ==================================================== */
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes pulse-rose-1 {
      0% { transform: scale(0.9); opacity: 0.9; }
      50% { transform: scale(1.08); opacity: 0.5; }
      100% { transform: scale(0.9); opacity: 0.9; }
    }

    @keyframes pulse-rose-2 {
      0% { transform: scale(0.92); opacity: 0.7; }
      50% { transform: scale(1.12); opacity: 0.35; }
      100% { transform: scale(0.92); opacity: 0.7; }
    }

    @keyframes pulse-rose-3 {
      0% { transform: scale(0.95); opacity: 0.5; }
      50% { transform: scale(1.18); opacity: 0.15; }
      100% { transform: scale(0.95); opacity: 0.5; }
    }

    @keyframes pulse-white-1 {
      0% { transform: scale(1); opacity: 0.9; }
      100% { transform: scale(1.15); opacity: 0; }
    }

    @keyframes pulse-white-2 {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(1.25); opacity: 0; }
    }

    @keyframes pulse-white-3 {
      0% { transform: scale(1); opacity: 0.6; }
      100% { transform: scale(1.35); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .ring, .mic-button, .spinner-ring {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body class="idle">
  <div class="app-container">
    <!-- Top Header -->
    <header class="header-section">
      <h1 class="app-title">సఖి</h1>
    </header>

    <!-- Caption / What Sakhi Said -->
    <section class="caption-box" aria-live="polite">
      <div id="caption" class="caption-text">మాట్లాడటానికి పసుపు బటన్ నొక్కండి</div>
    </section>

    <!-- Documents Card Row (Hidden until qualified) -->
    <section id="docs-container" class="docs-container hidden" aria-label="కావలసిన కాగితాలు"></section>

    <!-- Office / Where to Go Box (Hidden until qualified) -->
    <section id="place-box" class="place-box hidden" aria-live="polite"></section>

    <!-- Voice Control Area -->
    <div class="voice-control-area">
      <div class="mic-wrapper">
        <div class="ring ring-1"></div>
        <div class="ring ring-2"></div>
        <div class="ring ring-3"></div>
        <button id="mic-btn" class="mic-button" type="button" aria-label="మాట్లాడండి">
          <svg class="mic-icon" viewBox="0 0 24 24" focusable="false" aria-hidden="true">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
          </svg>
          <div class="spinner-ring" aria-hidden="true"></div>
        </button>
      </div>

      <button id="replay-btn" class="replay-button hidden" type="button" aria-label="మళ్ళీ వినండి">
        🔁 మళ్ళీ చెప్పు
      </button>
    </div>
  </div>

  <script>
    (function () {
      // Elements
      const body = document.body;
      const micBtn = document.getElementById('mic-btn');
      const replayBtn = document.getElementById('replay-btn');
      const captionEl = document.getElementById('caption');
      const docsContainer = document.getElementById('docs-container');
      const placeBox = document.getElementById('place-box');

      // State
      let conversationHistory = [];
      let isFirstInteraction = true;
      let currentState = 'idle'; // idle | listening | thinking | speaking
      let lastSpokenText = '';
      let currentAudio = null;

      // Media & Recording
      let mediaStream = null;
      let mediaRecorder = null;
      let audioChunks = [];
      let audioContext = null;
      let analyser = null;
      let silenceCheckInterval = null;
      let maxRecordingTimeout = null;
      let hasDetectedSpeech = false;
      let silenceStartTime = null;

      // Document mapping table
      const DOC_MAP = {
        aadhaar: { emoji: '🪪', label: 'ఆధార్' },
        deathcert: { emoji: '📜', label: 'భర్త మరణ పత్రం' },
        ration: { emoji: '🍚', label: 'రేషన్ కార్డు' },
        passbook: { emoji: '🏦', label: 'బ్యాంకు పుస్తకం' },
        photo: { emoji: '📷', label: 'ఫోటో' }
      };

      const GREETING_TEXT = "నమస్కారం అమ్మా, నేను సఖిని. మీకు సహాయం చేస్తాను. ముందు చెప్పండి, మీరు ఆంధ్రప్రదేశ్లో ఉంటారా, తెలంగాణలో ఉంటారా?";
      const ERROR_TEXT = "అమ్మా, ఏదో సమస్య వచ్చింది. మళ్ళీ ప్రయత్నించండి.";
      const NOT_HEARD_TEXT = "అమ్మా, నాకు వినిపించలేదు. మళ్ళీ చెప్పండి.";

      function setState(newState) {
        currentState = newState;
        body.className = newState;
      }

      function setCaption(text) {
        captionEl.textContent = text;
      }

      function stopCurrentAudio() {
        if (currentAudio) {
          try {
            currentAudio.pause();
            currentAudio.currentTime = 0;
          } catch (e) {}
          currentAudio = null;
        }
      }

      async function speakText(text, onEndedCallback) {
        stopCurrentAudio();
        setState('speaking');

        try {
          const res = await fetch('/api/tts', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: text })
          });

          if (!res.ok) {
            throw new Error('TTS network error: ' + res.status);
          }

          const blob = await res.blob();
          const audioUrl = URL.createObjectURL(blob);
          const audio = new Audio(audioUrl);
          currentAudio = audio;

          audio.onended = function () {
            currentAudio = null;
            if (onEndedCallback) {
              onEndedCallback();
            } else {
              setState('idle');
            }
          };

          audio.onerror = function () {
            currentAudio = null;
            setState('idle');
          };

          await audio.play();
        } catch (err) {
          console.error('TTS playback error:', err);
          setState('idle');
          if (onEndedCallback) {
            onEndedCallback();
          }
        }
      }

      function renderDocs(docsList) {
        docsContainer.innerHTML = '';
        if (!Array.isArray(docsList) || docsList.length === 0) {
          docsContainer.classList.add('hidden');
          return;
        }

        let addedCount = 0;
        docsList.forEach(function (docKey) {
          const key = String(docKey).toLowerCase().trim();
          if (DOC_MAP[key]) {
            addedCount++;
            const card = document.createElement('div');
            card.className = 'doc-card';
            card.innerHTML = `
              <span class="doc-emoji" aria-hidden="true">${DOC_MAP[key].emoji}</span>
              <span class="doc-label">${DOC_MAP[key].label}</span>
            `;
            docsContainer.appendChild(card);
          }
        });

        if (addedCount > 0) {
          docsContainer.classList.remove('hidden');
        } else {
          docsContainer.classList.add('hidden');
        }
      }

      function renderPlace(placeText) {
        if (placeText && placeText.trim().length > 0) {
          placeBox.textContent = placeText.trim();
          placeBox.classList.remove('hidden');
        } else {
          placeBox.textContent = '';
          placeBox.classList.add('hidden');
        }
      }

      async function startListening() {
        stopCurrentAudio();
        setState('listening');
        audioChunks = [];
        hasDetectedSpeech = false;
        silenceStartTime = null;

        const recordingStartTime = Date.now();
        let ambientNoiseBaseline = 10;
        let ambientSamples = [];

        try {
          mediaStream = await navigator.mediaDevices.getUserMedia({
            audio: {
              echoCancellation: true,
              noiseSuppression: true,
              autoGainControl: true
            }
          });

          // Determine supported MIME type
          let mimeType = 'audio/webm';
          if (typeof MediaRecorder.isTypeSupported === 'function') {
            if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) {
              mimeType = 'audio/webm;codecs=opus';
            } else if (MediaRecorder.isTypeSupported('audio/mp4')) {
              mimeType = 'audio/mp4';
            } else if (MediaRecorder.isTypeSupported('audio/ogg;codecs=opus')) {
              mimeType = 'audio/ogg;codecs=opus';
            }
          }

          mediaRecorder = new MediaRecorder(mediaStream, { mimeType: mimeType });

          // AudioContext for silence & voice detection
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            audioContext = new AudioContextClass();
            if (audioContext.state === 'suspended') {
              await audioContext.resume();
            }
            const source = audioContext.createMediaStreamSource(mediaStream);
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 256;
            analyser.smoothingTimeConstant = 0.4;
            source.connect(analyser);

            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);

            const ring1 = document.querySelector('.ring-1');
            const ring2 = document.querySelector('.ring-2');

            silenceCheckInterval = setInterval(function () {
              if (currentState !== 'listening') return;
              analyser.getByteFrequencyData(dataArray);
              let sum = 0;
              for (let i = 0; i < bufferLength; i++) {
                sum += dataArray[i];
              }
              const averageVolume = sum / bufferLength;
              const elapsedMs = Date.now() - recordingStartTime;

              // 1. Initial 400ms: calibrate ambient noise baseline
              if (elapsedMs < 400) {
                ambientSamples.push(averageVolume);
                if (ambientSamples.length > 3) {
                  const ambSum = ambientSamples.reduce((a, b) => a + b, 0);
                  ambientNoiseBaseline = Math.max(8, ambSum / ambientSamples.length);
                }
                return;
              }

              // Dynamic thresholds based on ambient noise
              const speechTrigger = Math.max(14, ambientNoiseBaseline + 6);
              const silenceTrigger = Math.max(10, ambientNoiseBaseline + 2);

              // Real-time audio reactive pulse feedback on rings
              if (ring1 && ring2) {
                const voiceScale = Math.min(1.22, 1 + (averageVolume / 180));
                ring1.style.transform = `scale(${voiceScale})`;
              }

              // 2. Speech detection
              if (averageVolume > speechTrigger) {
                hasDetectedSpeech = true;
                silenceStartTime = null;
              } else if (hasDetectedSpeech && averageVolume < silenceTrigger) {
                // Ignore silence during the first 1200ms of recording to allow user to begin speaking
                if (elapsedMs > 1200) {
                  const now = Date.now();
                  if (!silenceStartTime) {
                    silenceStartTime = now;
                  } else if (now - silenceStartTime > 1400) {
                    // 1.4s of silence after speech detected
                    console.log('Speech ended: auto-stopping recorder after silence.');
                    stopListening();
                  }
                }
              } else if (hasDetectedSpeech && averageVolume >= silenceTrigger) {
                silenceStartTime = null;
              }
            }, 60);
          }

          // Safety timeout (max 15s)
          maxRecordingTimeout = setTimeout(function () {
            if (currentState === 'listening') {
              console.log('Max 15s timeout reached, stopping recorder.');
              stopListening();
            }
          }, 15000);

          mediaRecorder.ondataavailable = function (e) {
            if (e.data && e.data.size > 0) {
              audioChunks.push(e.data);
            }
          };

          mediaRecorder.onstop = async function () {
            cleanupAudioNodes();
            const audioBlob = new Blob(audioChunks, { type: mimeType });
            console.log('Recording stopped. Total audio size:', audioBlob.size, 'bytes, type:', mimeType);
            await processAudioRecording(audioBlob);
          };

          mediaRecorder.start(200);
        } catch (err) {
          console.error('Mic access error:', err);
          cleanupAudioNodes();
          setCaption(ERROR_TEXT);
          speakText(ERROR_TEXT);
        }
      }

      function cleanupAudioNodes() {
        if (silenceCheckInterval) {
          clearInterval(silenceCheckInterval);
          silenceCheckInterval = null;
        }
        if (maxRecordingTimeout) {
          clearTimeout(maxRecordingTimeout);
          maxRecordingTimeout = null;
        }
        if (audioContext) {
          try {
            audioContext.close();
          } catch (e) {}
          audioContext = null;
          analyser = null;
        }
        if (mediaStream) {
          mediaStream.getTracks().forEach(function (track) {
            track.stop();
          });
          mediaStream = null;
        }
      }

      function stopListening() {
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
          mediaRecorder.stop();
        }
      }

      async function processAudioRecording(audioBlob) {
        setState('thinking');

        try {
          // 1. Send to STT
          const formData = new FormData();
          const fileExtension = audioBlob.type.includes('mp4') ? 'm4a' : 'webm';
          formData.append('audio', audioBlob, 'speech.' + fileExtension);

          const sttRes = await fetch('/api/stt', {
            method: 'POST',
            body: formData
          });

          if (!sttRes.ok) {
            const errBody = await sttRes.json().catch(() => ({}));
            console.error('STT API error:', sttRes.status, errBody);
            throw new Error(errBody.error || ('STT error: ' + sttRes.status));
          }

          const sttData = await sttRes.json();
          const userTranscript = (sttData.text || '').trim();
          console.log('STT Transcript received:', userTranscript);

          // Empty transcript handling
          if (!userTranscript) {
            setCaption(NOT_HEARD_TEXT);
            lastSpokenText = NOT_HEARD_TEXT;
            replayBtn.classList.remove('hidden');
            speakText(NOT_HEARD_TEXT);
            return;
          }

          // 2. Add to conversation history
          conversationHistory.push({
            role: 'user',
            content: userTranscript
          });

          // 3. Call reasoning chat endpoint
          const chatRes = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ messages: conversationHistory })
          });

          if (!chatRes.ok) {
            throw new Error('Chat error: ' + chatRes.status);
          }

          const chatData = await chatRes.json();
          const reply = (chatData.reply || '').trim();
          const docs = chatData.docs || [];
          const place = (chatData.place || '').trim();

          // 4. Update UI
          setCaption(reply);
          renderDocs(docs);
          renderPlace(place);

          conversationHistory.push({
            role: 'assistant',
            content: reply
          });

          // 5. Construct spoken text & speak
          let textToSpeak = reply;
          if (place) {
            textToSpeak += ' ' + place;
          }

          lastSpokenText = textToSpeak;
          replayBtn.classList.remove('hidden');

          speakText(textToSpeak);
        } catch (err) {
          console.error('Processing error:', err);
          setCaption(ERROR_TEXT);
          lastSpokenText = ERROR_TEXT;
          replayBtn.classList.remove('hidden');
          speakText(ERROR_TEXT);
        }
      }

      // Mic Button Click Handler
      micBtn.addEventListener('click', function () {
        if (currentState === 'thinking') {
          return; // Ignore clicks while processing
        }

        if (currentState === 'listening') {
          // Manual stop when user taps during recording
          stopListening();
          return;
        }

        if (currentState === 'speaking') {
          // User interrupts speech to speak
          stopCurrentAudio();
          startListening();
          return;
        }

        // Idle state
        if (isFirstInteraction) {
          isFirstInteraction = false;
          setCaption(GREETING_TEXT);
          lastSpokenText = GREETING_TEXT;
          replayBtn.classList.remove('hidden');

          // First tap unlocks audio & speaks greeting, then starts recording immediately after
          speakText(GREETING_TEXT, function () {
            startListening();
          });
        } else {
          startListening();
        }
      });

      // Replay Button Click Handler
      replayBtn.addEventListener('click', function () {
        if (currentState === 'thinking') {
          return;
        }
        if (lastSpokenText) {
          speakText(lastSpokenText);
        }
      });
    })();
  </script>
</body>
</html>
