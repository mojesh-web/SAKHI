<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sakhi / சகி</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;600;700;800&family=Noto+Sans+Tamil:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="idle">
  <button id="reset-btn" class="reset-btn" aria-label="Reset Application">🔄</button>
  <div class="app-container">
    <header class="header-section">
      <h1 class="app-title" id="app-title-el">సఖి / சகி</h1>
    </header>

    <section class="caption-box" aria-live="assertive" aria-atomic="true">
      <div id="caption" class="caption-text">నమస్కారం / வணக்கம்</div>
    </section>

    <section id="docs-container" class="docs-container hidden" aria-label="Documents"></section>
    <section id="place-box" class="place-box hidden" aria-live="polite"></section>

    <div id="lang-buttons" class="lang-buttons hidden" role="group" aria-label="Language selection">
      <button class="lang-btn" data-lang="te" aria-label="Select Telugu">తెలుగు</button>
      <button class="lang-btn" data-lang="ta" aria-label="Select Tamil">தமிழ்</button>
    </div>

    <div class="voice-control-area">
      <div class="mic-wrapper">
        <div class="ring ring-1"></div>
        <div class="ring ring-2"></div>
        <div class="ring ring-3"></div>
        <button id="mic-btn" class="mic-button" type="button" aria-label="Tap to speak" aria-pressed="false">
          <svg class="mic-icon" viewBox="0 0 24 24" focusable="false" aria-hidden="true">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
          </svg>
          <div class="spinner-ring" aria-hidden="true"></div>
        </button>
      </div>

      <button id="replay-btn" class="replay-button hidden" type="button" aria-label="Replay audio">
        🔁 మళ్ళీ చెప్పండి
      </button>
    </div>
  </div>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
